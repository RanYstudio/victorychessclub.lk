<!DOCTYPE html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Victory Chess Club</title>
<link rel="icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.min.js"></script>

<style>
:root{--bg:#0a0f2c;--card:#131b45;--tx:#eef2ff;--mu:#a9b8e8;--ac:#8fb3ff;--bd:#25306b;--bt:#8fb3ff;--bx:#0a0f2c}
html[data-t=light]{--bg:#fff;--card:#f2f6ff;--tx:#0a0f2c;--mu:#44507e;--ac:#1b3fa8;--bd:#d3ddf7;--bt:#0a0f2c;--bx:#fff}
html[data-t=light] .lg{filter:invert(1) hue-rotate(180deg)}
*{box-sizing:border-box}
body{margin:0;font-family:Georgia,'Times New Roman',serif;background:var(--bg);color:var(--tx);line-height:1.55}
h1,h2,h3{font-weight:600;margin:.2em 0}
a{color:var(--ac)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:12px;padding:8px 14px}
header .b{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;white-space:nowrap;text-decoration:none;color:var(--tx)}
header img{height:36px}
nav{display:flex;gap:14px;overflow-x:auto;flex:1;font-family:system-ui,sans-serif;font-size:.9rem}
nav a{text-decoration:none;color:var(--mu);white-space:nowrap}
nav a:hover{color:var(--ac)}
button,.btn{font:600 .9rem system-ui,sans-serif;background:var(--bt);color:var(--bx);border:0;border-radius:8px;padding:9px 16px;cursor:pointer;text-decoration:none;display:inline-block}
.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.hero{text-align:center;padding:48px 16px 36px;background:linear-gradient(var(--card),var(--bg))}
.hero img{width:min(300px,80%)}
.hero p{max-width:560px;margin:10px auto 18px;color:var(--mu)}
section{max-width:1050px;margin:auto;padding:34px 16px}
section>h2{font-size:1.6rem;border-bottom:2px solid var(--ac);display:inline-block;padding-bottom:4px;margin-bottom:18px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.c img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--bd)}
.c div{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.c small,.mu{color:var(--mu);font-family:system-ui,sans-serif}
.c p{margin:0;font-size:.93rem}
.pr{font:700 1.05rem system-ui,sans-serif;color:var(--ac)}
.c .btn{margin-top:auto;text-align:center}
.em{color:var(--mu);font-style:italic}
footer{text-align:center;padding:26px 16px;border-top:1px solid var(--bd);color:var(--mu);font:.85rem system-ui,sans-serif}
#md{position:fixed;inset:0;background:rgba(5,8,25,.92);z-index:9;overflow:auto;padding:16px;display:none}
#md .x{position:sticky;top:0;float:right}
.ad{max-width:640px;margin:auto;padding:20px 16px;font-family:system-ui,sans-serif}
input,textarea,select{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs .on{background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.row button{background:#b3261e;color:#fff;padding:5px 10px}
body::before,body::after{position:fixed;pointer-events:none;z-index:0;color:var(--ac);opacity:.045;font-family:'Segoe UI Symbol','Noto Sans Symbols 2',serif;line-height:1}
body::before{content:'♞';right:-3vmin;bottom:-6vmin;font-size:62vmin}body::after{content:'♔';left:-4vmin;top:14vmin;font-size:34vmin}
main,footer,header{position:relative;z-index:1}header{position:sticky}
a.c{text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}a.c:hover{border-color:var(--ac);transform:translateY(-2px)}.c h3{color:var(--ac)}
.art{max-width:760px}.art.wide{max-width:1050px}.bk{font:600 .85rem system-ui,sans-serif;text-decoration:none}
.art h1{font-size:clamp(1.8rem,5vw,2.6rem);line-height:1.15;margin:.4em 0 .2em}hr.ac{border:0;height:3px;width:64px;background:var(--ac);margin:12px 0 22px;border-radius:2px}
.chip{display:inline-block;margin:14px 0 0;padding:3px 12px;border:1px solid var(--bd);border-radius:20px;color:var(--mu);font:.8rem system-ui,sans-serif;background:var(--card)}
.lead{color:var(--mu);font-size:1.05rem;max-width:680px}.tx{white-space:pre-line;font-size:1.08rem;line-height:1.75}
.cov{width:100%;max-height:440px;object-fit:cover;border-radius:14px;margin:0 0 22px;box-shadow:0 10px 30px #0004}
.mi{width:100%;border-radius:14px;max-height:480px;object-fit:contain;background:var(--card);border:1px solid var(--bd)}
.ths{display:flex;gap:8px;overflow-x:auto;margin-top:10px}.th{height:64px;border-radius:8px;cursor:pointer;border:2px solid var(--bd)}.th:hover{border-color:var(--ac)}
.split{display:grid;grid-template-columns:1.1fr 1fr;gap:28px;align-items:start}.pr.big{font-size:1.9rem;margin-bottom:10px}
.prof{display:flex;gap:22px;align-items:flex-start}.avt{width:160px;height:160px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);flex:none}
.sh{margin:22px 0 10px;color:var(--mu);font:600 .8rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.1em}.live{color:#e5484d;font-weight:700}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 16px}.tb{padding:6px 14px;border:1px solid var(--bd);border-radius:20px;text-decoration:none;font:600 .85rem system-ui,sans-serif;background:var(--card);color:var(--tx)}.tb.on{background:var(--ac);color:var(--bx);border-color:var(--ac)}
nav a.on{color:var(--ac);font-weight:700}
.bcw{display:grid;grid-template-columns:270px 1fr;gap:20px}.gl{max-height:640px;overflow:auto;border:1px solid var(--bd);border-radius:10px;background:var(--card)}
.gm{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:9px 12px;border-bottom:1px solid var(--bd);text-decoration:none;color:var(--tx);font:.85rem system-ui,sans-serif}.gm span:last-child{text-align:right}.gm.on{background:var(--ac);color:var(--bx)}.gt{margin:0 0 10px;font-size:1.1rem}
.bw{display:flex;gap:6px;max-width:600px}.bd{display:grid;grid-template-columns:repeat(8,1fr);flex:1;aspect-ratio:1;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px #0006;user-select:none}
.sq{display:grid;place-items:center;position:relative;font-size:clamp(22px,6.2vw,52px);cursor:pointer}.sq.l{background:#dce9fb}.sq.d{background:#5b87c9}
.sq i{font-style:normal;line-height:1}.sq i.w{color:#fff;text-shadow:0 0 2px #000,0 0 3px #000,0 1px 2px #000}.sq i.b{color:#0a1f4d;text-shadow:0 0 1px #fff}
.sq.lm{box-shadow:inset 0 0 0 100px rgba(255,214,10,.4)}.sq.sel{box-shadow:inset 0 0 0 100px rgba(255,214,10,.6)}.sq.hint::after{content:'';width:28%;height:28%;border-radius:50%;background:rgba(10,31,77,.4);position:absolute}
.evb{width:14px;background:#0a1f4d;border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}.evb b{display:block;width:100%;height:50%;background:#fff;transition:height .3s}
.ctl{display:flex;gap:6px;margin:10px 0}.mv{max-height:200px;overflow:auto;font:.9rem system-ui,sans-serif;line-height:2.1;max-width:600px}.mv a{cursor:pointer;padding:2px 6px;border-radius:5px}.mv a.cur{background:var(--ac);color:var(--bx)}.mn{color:var(--mu);margin-left:4px}
.an{display:grid;grid-template-columns:minmax(0,600px) 1fr;gap:24px}.opn{font:700 1rem system-ui,sans-serif;color:var(--ac);min-height:1.5em;margin-bottom:8px}
.ln{padding:8px 0;border-bottom:1px solid var(--bd);font:.9rem system-ui,sans-serif}.ln b{display:inline-block;min-width:56px}.ln a{cursor:pointer}.lines{margin-bottom:14px}
@media(max-width:820px){.an,.bcw,.split{grid-template-columns:1fr}.prof{flex-direction:column}}
</style>
</head>

 return `<a class="c" href="#${t}/${x.id}">${img(pics(x)[0])}<div><small>${esc(s)}</small><h3>${esc(isP(t)?x.name:x.title)}</h3>${t=='shop'?`<span class="pr">Rs. ${esc(x.price)}</span>`:''}<p>${esc(ex(x.body||x.description))}</p></div></a>`};

const det=(t,x)=>{const P=pics(x),name=isP(t)?x.name:x.title,tx=esc(x.body||x.description||'');
 const chip=t=='news'?new Date(x.created_at).toLocaleDateString():t=='events'?x.date:(x.title||'');let b;

 else if(t=='players'||t=='directory')b=`<div class="prof">${P[0]?`<img class="avt" src="${esc(P[0])}" alt="">`:''}<div><p class="tx">${tx}</p>${x.contact?`<p class="chip">${esc(x.contact)}</p>`:''}</div></div>`;
 else b=(P[0]&&t=='news'?`<img class="cov" src="${esc(P[0])}" alt="">`:'')+`<p class="tx">${tx}</p>`+(t=='events'?`<div class="g">${P.map(u=>`<div class="c">${img(u)}<div><button onclick="dl('${esc(u)}')">Download</button></div></div>`).join('')}</div>`:'');
 return `<section class="art"><a class="bk" href="#${t}">← ${T[t].n}</a>${chip?`<div class="chip">${esc(chip)}</div>`:''}<h1>${esc(name)}</h1><hr class="ac">${b}</section>`};
// ===== chess board + viewer =====
const PC={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};let KV=null;
function drawBoard(el,ch,o){const b=ch.board(),h=[];
 for(let r=0;r<8;r++)for(let f=0;f<8;f++){const R=o.flip?7-r:r,F=o.flip?7-f:f,p=b[R][F],sq='abcdefgh'[F]+(8-R),c=['sq',(R+F)%2?'d':'l'];
  if(o.last&&(o.last.from==sq||o.last.to==sq))c.push('lm');if(o.sel==sq)c.push('sel');if(o.hints.includes(sq))c.push('hint');
  h.push(`<div class="${c.join(' ')}" data-s="${sq}">${p?`<i class="${p.color}">${PC[p.type]}\uFE0E</i>`:''}</div>`)}
 el.innerHTML=h.join('');el.onclick=o.click?e=>{const s=e.target.closest('.sq');if(s)o.click(s.dataset.s)}:null}
function viewer(host,sans,opt){const V={sans:sans.slice(),i:sans.length,flip:false,sel:null,fen:null};
 host.innerHTML='<div class="bw"><div class="evb" hidden><b></b></div><div class="bd"></div></div><div class="ctl">'+[['s','⏮'],['p','◀'],['n','▶'],['e','⏭'],['f','⇅']].map(a=>`<button data-a="${a[0]}" class="ghost">${a[1]}</button>`).join('')+'</div><div class="mv"></div>';
 const bd=host.querySelector('.bd'),mv=host.querySelector('.mv');KV=V;
 V.pos=()=>{const c=V.fen?new Chess(V.fen):new Chess();let l=null;for(let k=0;k<V.i;k++)l=c.move(V.sans[k]);V.ch=c;V.last=l;return c};
 V.play=s=>{V.sans=V.sans.slice(0,V.i);V.sans.push(s);V.i++;V.sel=null;V.draw()};
 const clk=s=>{const c=V.ch;if(V.sel&&V.sel!=s){const m=c.move({from:V.sel,to:s,promotion:'q'});if(m){V.play(m.san);return}}
  const p=c.get(s);V.sel=p&&p.color==c.turn()?s:null;V.draw()};
 V.draw=()=>{V.pos();const hints=V.sel?V.ch.moves({square:V.sel,verbose:true}).map(m=>m.to):[];
  drawBoard(bd,V.ch,{flip:V.flip,last:V.last,sel:V.sel,hints,click:opt&&opt.edit?clk:null});
  mv.innerHTML=V.sans.map((s,k)=>`${k%2?'':`<span class="mn">${k/2+1}.</span>`}<a data-k="${k+1}" class="${k+1==V.i?'cur':''}">${esc(s)}</a>`).join(' ')||'<span class="em">No moves yet</span>';
  const cu=mv.querySelector('.cur');if(cu)mv.scrollTop=cu.offsetTop-mv.clientHeight/2;
  opt&&opt.onChange&&opt.onChange(V)};
 host.addEventListener('click',e=>{const a=e.target.dataset;if(a.a){V.sel=null;({s:()=>V.i=0,p:()=>V.i=Math.max(0,V.i-1),n:()=>V.i=Math.min(V.sans.length,V.i+1),e:()=>V.i=V.sans.length,f:()=>V.flip=!V.flip})[a.a]();V.draw()}else if(a.k){V.i=+a.k;V.sel=null;V.draw()}});
 V.draw();return V}
addEventListener('keydown',e=>{if(!KV||/input|textarea/i.test(e.target.tagName)||!$('.bd'))return;if(e.key=='ArrowLeft'){KV.i=Math.max(0,KV.i-1);KV.sel=null;KV.draw()}else if(e.key=='ArrowRight'){KV.i=Math.min(KV.sans.length,KV.i+1);KV.sel=null;KV.draw()}});
// ===== Lichess broadcasts =====
const LI='https://lichess.org/api/broadcast';let POLL=null;
const jf=async u=>{const r=await fetch(u);if(!r.ok)throw 0;return r.json()};
const bcCard=(i,lv)=>{const t=i.tour||{},r=i.round||{};return `<a class="c" href="#watch/${esc(t.id)}">${img(t.image)}<div><small>${lv?'<span class="live">● LIVE</span> ':''}${esc(r.name||'')}${r.startsAt?' · '+fmtD(r.startsAt):''}</small><h3>${esc(t.name)}</h3><p>${esc(ex(t.description||'',110))}</p></div></a>`};
async function fillHB(){try{const j=await jf(LI+'/top'),L=(j.active||[]).slice(0,3).concat((j.upcoming||[]).slice(0,1)),el=$('#hbg');if(el)el.innerHTML=L.map(i=>bcCard(i,i.round&&i.round.ongoing)).join('')||'<p class="em">No broadcasts right now.</p>'}catch(e){const el=$('#hbg');if(el)el.innerHTML='<p class="em">Broadcasts are unavailable right now.</p>'}}
async function watchList(s){s.innerHTML='<section><h2>Broadcasts</h2><p class="mu">Live tournaments from around the world. Pick one to follow the games round by round.</p><div id="bl"><p class="em">Loading…</p></div></section>';
 try{const j=await jf(LI+'/top'),pa=(j.past&&j.past.currentPageResults)||[],blk=(n,L,lv)=>L.length?`<h3 class="sh">${n}</h3><div class="g">${L.map(i=>bcCard(i,lv&&i.round&&i.round.ongoing)).join('')}</div>`:'';
  const el=$('#bl');if(el)el.innerHTML=blk('Live & recent',j.active||[],1)+blk('Upcoming',j.upcoming||[])+blk('Past',pa)||'<p class="em">No broadcasts found.</p>'}
 catch(e){const el=$('#bl');if(el)el.innerHTML='<p class="em">Could not load broadcasts. Please try again later.</p>'}}
async function watchTour(s,tid,rid,gi){s.innerHTML='<section><p class="em">Loading…</p></section>';let j;
 try{j=await jf(`${LI}/${tid}`)}catch(e){s.innerHTML='<section class="art"><a class="bk" href="#watch">← Broadcasts</a><p class="em">Could not load this tournament.</p></section>';return}
 const t=j.tour||{},R=j.rounds||[];rid=rid||j.defaultRoundId||(R.find(r=>r.ongoing)||R[R.length-1]||{}).id;
 s.innerHTML=`<section class="art wide"><a class="bk" href="#watch">← Broadcasts</a><h1>${esc(t.name)}</h1><hr class="ac"><p class="lead">${esc(ex(t.description||'',280))}</p><div class="tabs">${R.map(r=>`<a class="tb${r.id==rid?' on':''}" href="#watch/${tid}/${r.id}">${esc(r.name)}${r.ongoing?' ●':''}</a>`).join('')}</div><div id="bcg"><p class="em">Loading games…</p></div></section>`;
 const box=$('#bcg');if(!rid){box.innerHTML='<p class="em">No rounds yet.</p>';return}
 const rd=R.find(r=>r.id==rid)||{},H=(p,k)=>(p.match(new RegExp('\\['+k+' "([^"]*)"'))||[])[1]||'';
 const get=async()=>(await (await fetch(`${LI}/round/${rid}.pgn`)).text()).split(/\n\s*\n(?=\[Event )/).map(p=>p.trim()).filter(Boolean).map(p=>{const c=new Chess();c.load_pgn(p);return{p,w:H(p,'White'),b:H(p,'Black'),we:H(p,'WhiteElo'),be:H(p,'BlackElo'),r:H(p,'Result')||'*',sans:c.history()}});
 let G;try{G=await get()}catch(e){G=[]}
 if(!G.length){box.innerHTML='<p class="em">Games will appear here when the round starts.</p>';return}
 gi=Math.min(+gi||0,G.length-1);
 const list=()=>G.map((g,k)=>`<a class="gm${k==gi?' on':''}" href="#watch/${tid}/${rid}/${k}"><span>${esc(g.w)}</span><b>${g.r=='1/2-1/2'?'½':g.r=='*'?'·':esc(g.r)}</b><span>${esc(g.b)}</span></a>`).join('');
 const g=G[gi];box.innerHTML=`<div class="bcw"><div class="gl">${list()}</div><div><h3 class="gt">${esc(g.w)} ${g.we?'('+esc(g.we)+')':''} vs ${esc(g.b)} ${g.be?'('+esc(g.be)+')':''}</h3><div id="bv"></div><p><button class="ghost" id="an">Analyse this game</button></p></div></div>`;
 const V=viewer($('#bv'),g.sans);
 $('#an').onclick=()=>{try{sessionStorage.setItem('pgn',g.p)}catch(e){}location.hash='#analysis'};
 if(rd.ongoing)POLL=setInterval(async()=>{try{const N=await get(),at=V.i==V.sans.length;N.forEach((n,k)=>{if(G[k])G[k].r=n.r;else G[k]=n});if(N[gi]){V.sans=N[gi].sans;if(at)V.i=V.sans.length;V.draw()}$('.gl').innerHTML=list()}catch(e){}},12000)}
// ===== analysis (Stockfish in the browser) =====
const OPN=new Map();let opL=false,EW=null,run=false,pend=null,EI={};
async function loadOpn(){if(opL)return;opL=true;try{await Promise.all('abcde'.split('').map(async f=>{const t=await (await fetch(`https://cdn.jsdelivr.net/gh/lichess-org/chess-openings@master/${f}.tsv`)).text();t.split('\n').slice(1).forEach(l=>{const [e,n,p]=l.split('\t');if(p)OPN.set(p.replace(/\d+\.\s*/g,'').trim(),e+' · '+n)})}))}catch(e){}}
const opName=V=>{if(V.fen)return '';for(let k=V.i;k>0;k--){const n=OPN.get(V.sans.slice(0,k).join(' '));if(n)return n}return ''};
function engInit(){if(EW)return;try{EW=new Worker('engine/stockfish-19-lite-single.js');EW.onerror=()=>{EW=null;const l=$('#ln');if(l)l.innerHTML='<small class="mu">The engine is unavailable right now.</small>'};EW.onmessage=e=>eng(String(e.data));EW.postMessage('uci');EW.postMessage('setoption name MultiPV value 3')}catch(e){EW=null}}
function analyse(fen){const l=$('#ln');if(!EW){return}if(!fen){pend=null;if(run)EW.postMessage('stop');if(l)l.innerHTML='<small class="mu">Game over</small>';return}pend=fen;if(run)EW.postMessage('stop');else go()}
function go(){if(!pend)return;const f=pend;pend=null;run=true;EI={fen:f,lines:{}};EW.postMessage('position fen '+f);EW.postMessage('go depth 20')}
function eng(m){if(m.startsWith('bestmove')){run=false;if(pend)go();return}
 if(m.startsWith('info')&&m.includes(' pv ')&&run){const sc=m.match(/score (cp|mate) (-?\d+)/);if(!sc)return;const d=+(m.match(/ depth (\d+)/)||[])[1],k=+(m.match(/multipv (\d+)/)||[,1])[1];EI.lines[k]={d,t:sc[1],v:+sc[2],pv:m.split(' pv ')[1].trim().split(' ')};showLines()}}
function showLines(){const l=$('#ln');if(!l)return;const w=EI.fen.split(' ')[1]=='w',h=[];let top=null;
 Object.keys(EI.lines).sort().forEach(k=>{const x=EI.lines[k],v=w?x.v:-x.v,c=new Chess(EI.fen),san=[];
  for(const u of x.pv.slice(0,8)){const m=c.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});if(!m)break;san.push(m.san)}
  if(!top)top=x.t=='mate'?(v>0?1000:-1000):v;
  h.push(`<div class="ln"><b>${x.t=='mate'?(v>0?'+':'-')+'M'+Math.abs(x.v):(v>=0?'+':'')+(v/100).toFixed(2)}</b> <a data-m="${esc(san[0]||'')}">${esc(san.join(' '))}</a> <small class="mu">d${x.d}</small></div>`)});
 l.innerHTML=h.join('');const b=document.querySelector('.evb b');if(b&&top!=null)b.style.height=(50+50*Math.tanh(top/500))+'%'}
function analysisPage(s){s.innerHTML=`<section class="art wide"><h1>Analysis</h1><hr class="ac"><p class="lead">Play moves on the board, step through a game, and see Stockfish's evaluation and best lines. Paste a game (PGN) or a position (FEN) to study it.</p><div class="an"><div id="av"></div><div><div class="opn" id="op"></div><div id="ln" class="lines"><small class="mu">Engine starting…</small></div><textarea id="pg" rows="5" placeholder="Paste PGN or FEN here"></textarea><button id="ld">Load</button> <button class="ghost" id="nb">New board</button></div></div></section>`;
 let sans=[],pg=null;try{pg=sessionStorage.getItem('pgn');sessionStorage.removeItem('pgn')}catch(e){}
 if(pg){const c=new Chess();if(c.load_pgn(pg))sans=c.history()}
 let tm;const V=viewer($('#av'),sans,{edit:1,onChange:v=>{$('#op').textContent=opName(v);clearTimeout(tm);tm=setTimeout(()=>analyse(v.ch.game_over()?null:v.ch.fen()),250)}});
 document.querySelector('.evb').hidden=false;loadOpn().then(()=>V.draw());engInit();
 $('#ln').onclick=e=>{const m=e.target.dataset.m;if(m){try{V.play(m)}catch(x){}}};
 $('#ld').onclick=()=>{const t=$('#pg').value.trim();if(!t)return;const c=new Chess();
  if(c.load(t)){V.fen=t;V.sans=[];V.i=0}else if(c.load_pgn(t)){V.fen=null;V.sans=c.history();V.i=V.sans.length}else{alert('That is not a valid PGN or FEN.');return}V.draw()};
 $('#nb').onclick=()=>{V.fen=null;V.sans=[];V.i=0;V.draw()}}
async function load(t){const {data,error}=await sb.from(t).select('*').order('created_at',{ascending:false});D[t]=error?[]:data;if(!/^#(admin|watch|analysis)/.test(location.hash))show()}
function show(){clearInterval(POLL);KV=null;if(EW&&run){pend=null;EW.postMessage('stop')}
 const [p,a,b,c]=location.hash.slice(1).split('/');if(p=='admin')return;const s=$('#site');
 document.querySelectorAll('nav a').forEach(n=>n.classList.toggle('on',n.getAttribute('href')=='#'+p));
 if(p=='watch'){a?watchTour(s,a,b,c):watchList(s);return}
 if(p=='analysis'){analysisPage(s);return}
 let o;if(T[p]&&a){const x=(D[p]||[]).find(v=>v.id==a);o=x?det(p,x):'<section><p class="em">Loading…</p></section>'}
 else if(T[p])o=`<section><h2>${T[p].n}</h2>${grid(p,999)}</section>`;
 else{o=`<div class="hero"><img class="lg" src="logo.png" alt="Victory Chess Club"><p>Welcome to Victory Chess Club. Learn, compete and grow with us.</p><a class="btn" href="#events">See our events</a> <a class="btn ghost" href="#watch">Watch broadcasts</a> <a class="btn ghost" href="#analysis">Analyse a game</a></div>${sec('news',3)}<section><h2>Broadcasts</h2><div class="g" id="hbg"><p class="em">Loading…</p></div><p><a href="#watch">All live tournaments →</a></p></section>${sec('events',3)}${sec('players',4)}${sec('directory',4)}${sec('shop',4)}<section><h2>Analysis Board</h2><p class="mu">Study your games and prepare for opponents with Stockfish, right here.</p><a class="btn" href="#analysis">Open the board</a></section>`;setTimeout(fillHB,0)}
 s.innerHTML=o}
async function dl(u){
 try{const b=await (await fetch(u)).blob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=u.split('/').pop();a.click()}
 catch(e){window.open(u,'_blank')}
}
// theme
const sv=()=>{try{return localStorage.getItem('t')}catch(e){return null}};
let th=sv()||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
function setT(v){th=v;document.documentElement.dataset.t=v;try{localStorage.setItem('t',v)}catch(e){}}
setT(th);$('#th').onclick=()=>setT(th=='dark'?'light':'dark');
$('#yr').textContent=new Date().getFullYear();
// admin
let cur='news';
async function admin(){
 const {data:{session}}=await sb.auth.getSession(), m=$('#adm');
 if(!session){m.innerHTML=`<div class="ad"><h2>Admin login</h2><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button onclick="login()">Log in</button> <a href="#">Back to site</a><p id="er" style="color:#e66"></p></div>`;return}
 await load(cur);
 const t=T[cur];
 m.innerHTML=`<div class="ad"><h2>Admin</h2><button class="ghost" onclick="logout()">Log out</button> <a href="#">View site</a>
 <div class="tabs">${Object.keys(T).map(k=>`<button class="${k==cur?'on':'ghost'}" onclick="cur='${k}';admin()">${T[k].n}</button>`).join('')}</div>
 <h3>Add to ${t.n}</h3>
 <div id="fm">${t.f.map(([k,l,ty])=>`<label>${l}${ty=='area'?`<textarea id="f-${k}" rows="3"></textarea>`:ty=='file'?`<input id="f-${k}" type="file" accept="image/*">`:ty=='files'?`<input id="f-${k}" type="file" accept="image/*" multiple>`:`<input id="f-${k}">`}</label>`).join('')}
 <button id="sv" onclick="save()">Save</button> <span id="ms" class="mu"></span></div>
 <h3>Existing</h3>${D[cur].map(x=>`<div class="row"><span>${esc(x.title||x.name)}</span><button onclick="del(${x.id})">Delete</button></div>`).join('')||'<p class="em">Empty.</p>'}</div>`;
}
async function login(){
 const {error}=await sb.auth.signInWithPassword({email:$('#em').value,password:$('#pw').value});
 error?$('#er').textContent=error.message:admin();
}
async function logout(){await sb.auth.signOut();admin()}
async function up(f){
 const n=Date.now()+'-'+Math.random().toString(36).slice(2,7)+'-'+f.name.replace(/[^\w.]/g,'_');
 const {error}=await sb.storage.from('media').upload(n,f);
 if(error)throw error;
 return sb.storage.from('media').getPublicUrl(n).data.publicUrl;
}
async function save(){
 const ms=$('#ms'),b=$('#sv');b.disabled=true;ms.textContent='Saving…';
 try{
  const row={};
  for(const [k,,ty] of T[cur].f){
   const el=$('#f-'+k);
   if(ty=='file') row[k]=el.files[0]?await up(el.files[0]):null;
   else if(ty=='files'){row[k]=[];for(const f of el.files){ms.textContent='Uploading '+(row[k].length+1)+'/'+el.files.length+'…';row[k].push(await up(f))}}
   else row[k]=el.value;
  }
  const {error}=await sb.from(cur).insert(row);
  if(error)throw error;
  admin();
 }catch(e){ms.textContent='Error: '+(e.message||e);b.disabled=false}
}
async function del(id){
 if(!confirm('Delete this item?'))return;
 await sb.from(cur).delete().eq('id',id);admin();
}
function route(){const a=location.hash=='#admin';$('#site').style.display=a?'none':'block';$('#adm').style.display=a?'block':'none';if(a)admin();else{show();scrollTo(0,0)}}
addEventListener('hashchange',route);
Object.keys(T).forEach(load);
route();
</script>
